<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Lobby Wayfinding Sign</title>
<style>
/* The Apr 13 wayfinding slide, made live. Black field, bold white names with line arrows beside them,
   "time | room" underneath, the icon in the bottom right corner. The grid picks one or two columns
   and the type sizes itself to fill the screen for however many tagged events are left today. */
@font-face {
  font-family: "Sign Sans";
  src: local("HelveticaNeue-Bold"), local("Helvetica Neue Bold"),
       url("assets/heros-bold.woff2") format("woff2");
  font-weight: 700;
  font-style: normal;
  font-display: block;
}
:root {
  --black: #000000;    /* Brand Black */
  --white: #FFFFFF;    /* Brand White */
  --grey: #E2E3E4;     /* Brand Light Grey */
  --dim: #8E9093;      /* Light Grey stepped down, status line only */
  --sans: "Sign Sans", Arial, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--black);
  color: var(--white);
  font-family: var(--sans);
  font-weight: 700;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  cursor: none;
}
[hidden] { display: none !important; }

.sign {
  position: relative;
  box-sizing: border-box;
  height: 100%;
  padding: 8.5vh 12.4vw 8.5vh 5.6vw;
}
.board {
  height: 100%;
  display: grid;
  grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr));
  grid-template-rows: repeat(var(--rows, 3), minmax(0, 1fr));
  grid-column-gap: 4.5vw;
  grid-row-gap: 4.5vh;
  column-gap: 4.5vw;
  row-gap: 4.5vh;
  font-size: var(--fs, 64px);
}
.item {
  display: grid;
  grid-template-columns: 0.92em minmax(0, 1fr);
  grid-column-gap: 0.28em;
  column-gap: 0.28em;
  align-content: start;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
}
.arrow { display: block; width: 0.92em; height: 0.92em; margin-top: 0.05em; color: var(--white); }
.text { min-width: 0; }
.name { line-height: 1.06; letter-spacing: -0.005em; text-wrap: balance; }
.sub { margin-top: 0.12em; font-size: 0.6em; line-height: 1.15; color: var(--grey); }
.where { margin-top: 0.1em; line-height: 1.06; color: var(--grey); white-space: nowrap; }

.icon {
  position: absolute;
  right: 5.6vw;
  bottom: 8.5vh;
  height: 13.5vh;
  width: auto;
}
.welcome {
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.welcome p { margin: 0; font-size: 10vh; line-height: 1.04; letter-spacing: -0.005em; }

.status {
  position: absolute;
  left: 5.6vw;
  bottom: 3vh;
  font-size: 1.9vh;
  color: var(--dim);
}
</style>
</head>
<body>
<main class="sign" id="sign">
  <div class="board" id="board" aria-live="polite"></div>
  <div class="welcome" id="welcome" hidden>
    <p>In Portland</p>
    <p>as it is</p>
    <p>in Heaven.</p>
  </div>
  <img class="icon" alt="Bridgetown Church" src="assets/bridgetown-icon.png">
  <span class="status" id="status" hidden></span>
</main>

<script src="config.js"></script>
<script>
(function () {
  var CFG = window.LOBBY_SIGN || { rooms: [] };
  var TIME_ZONE = "America/Los_Angeles";
  var PER_PAGE = 8;
  var PAGE_SECONDS = 10;
  var STALE_MINUTES = 15;
  var STORE_KEY = "lobbySign.lastData";

  // Arrow numbers from config.js. Straight arrows are one shape rotated; turn arrows have their own path.
  var STRAIGHT = "M8 50 H90 M60 20 L90 50 L60 80";
  var ARROWS = {
    1: { label: "Straight Ahead", angle: 270 },
    2: { label: "Ahead Left", angle: 225 },
    3: { label: "Ahead Right", angle: 315 },
    4: { label: "Left", angle: 180 },
    5: { label: "Right", angle: 0 },
    6: { label: "Ahead, Then Left", path: "M70 94 V32 H12 M38 6 L12 32 L38 58" },
    7: { label: "Ahead, Then Right", path: "M30 94 V32 H88 M62 6 L88 32 L62 58" },
    8: { label: "Down Left", angle: 135 },
    9: { label: "Down Right", angle: 45 },
    10: { label: "Down", angle: 90 }
  };

  var board = document.getElementById("board");
  var welcome = document.getElementById("welcome");
  var statusEl = document.getElementById("status");

  // Test modes for the TV: add ?sample or ?key to the address (#sample and #key work too).
  function readMode() {
    var m = (location.hash || "").replace("#", "") || (location.search || "").replace("?", "").split(/[&=]/)[0];
    return m === "key" || m === "sample" ? m : "";
  }
  var mode = readMode();
  var data = null;
  var lastGood = 0;
  var pages = [];
  var pageIndex = 0;

  function norm(s) { return String(s || "").toLowerCase().replace(/[^a-z0-9]/g, ""); }

  var ROOM_LOOKUP = {};
  (CFG.rooms || []).forEach(function (r) { ROOM_LOOKUP[norm(r.room)] = r; });

  // Match a Planning Center room name to config.js: exact first, then "contains" (e.g. "Classroom: Broadway").
  function roomInfo(pcoName) {
    var n = norm(pcoName);
    if (ROOM_LOOKUP[n]) return ROOM_LOOKUP[n];
    var best = null;
    for (var k in ROOM_LOOKUP) {
      if (k && n.indexOf(k) !== -1 && (!best || k.length > norm(best.room).length)) best = ROOM_LOOKUP[k];
    }
    return best;
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // Brand Guide time format: "6:30 PM", "2 PM". Always in Portland time.
  function formatTime(date) {
    var h, m;
    try {
      var parts = new Intl.DateTimeFormat("en-US", { timeZone: TIME_ZONE, hour: "numeric", minute: "2-digit", hour12: false }).formatToParts(date);
      parts.forEach(function (p) { if (p.type === "hour") h = Number(p.value) % 24; if (p.type === "minute") m = Number(p.value); });
    } catch (err) {}
    if (h === undefined || isNaN(h)) { h = date.getHours(); m = date.getMinutes(); }
    var ap = h < 12 ? "AM" : "PM";
    var hh = h % 12 || 12;
    return (m ? hh + ":" + (m < 10 ? "0" : "") + m : String(hh)) + " " + ap;
  }

  function arrowSvg(num) {
    var a = ARROWS[num];
    if (!a) return '<span class="arrow" aria-hidden="true"></span>';
    var turn = a.path ? "" : ' transform="rotate(' + a.angle + ' 50 50)"';
    return '<svg class="arrow" viewBox="0 0 100 100" aria-hidden="true"><g' + turn + ">" +
      '<path d="' + (a.path || STRAIGHT) + '" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="square" stroke-linejoin="miter"/>' +
      "</g></svg>";
  }

  function itemHtml(e) {
    if (e.keyItem) {
      return '<div class="item">' + arrowSvg(e.arrow) + '<div class="text"><div class="name">' + esc(e.label) +
        '</div><div class="where">Arrow ' + e.arrow + "</div></div></div>";
    }
    var arrow = null, shown = [];
    (e.rooms || []).forEach(function (r) {
      var info = roomInfo(r);
      if (info && arrow === null && info.arrow) arrow = info.arrow;
      shown.push(info ? (info.show || info.room) : r);
    });
    var split = e.name.indexOf(" | ");
    var main = split === -1 ? e.name : e.name.slice(0, split);
    var sub = split === -1 ? "" : e.name.slice(split + 3);
    var where = esc(formatTime(new Date(e.start))) + (shown.length ? " | " + esc(shown.join(" & ")) : "");
    return '<div class="item">' + arrowSvg(arrow) +
      '<div class="text"><div class="name">' + esc(main) + "</div>" +
      (sub ? '<div class="sub">' + esc(sub) + "</div>" : "") +
      '<div class="where">' + where + "</div></div></div>";
  }

  function layoutsFor(n) {
    if (n <= 1) return [[1, 1]];
    if (n === 2) return [[1, 2], [2, 1]];
    if (n === 3) return [[1, 3], [2, 2]];
    if (n === 4) return [[2, 2], [1, 4]];
    if (n <= 6) return [[2, 3]];
    if (n <= 8) return [[2, 4]];
    return [[2, 5]];
  }

  function fits() {
    var items = board.children;
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      if (it.scrollHeight > it.clientHeight + 1 || it.scrollWidth > it.clientWidth + 1) return false;
    }
    return true;
  }

  // Try each layout, find the largest type that fits, keep the winner.
  function fitBoard(n) {
    var maxFs = Math.min(window.innerHeight * 0.15, window.innerWidth * 0.09);
    var best = { fs: 0, cols: 1, rows: 1 };
    layoutsFor(n).forEach(function (l) {
      board.style.setProperty("--cols", l[0]);
      board.style.setProperty("--rows", l[1]);
      var lo = 14, hi = maxFs;
      for (var k = 0; k < 14; k++) {
        var mid = (lo + hi) / 2;
        board.style.setProperty("--fs", mid + "px");
        if (fits()) lo = mid; else hi = mid;
      }
      if (lo > best.fs) best = { fs: lo, cols: l[0], rows: l[1] };
    });
    board.style.setProperty("--cols", best.cols);
    board.style.setProperty("--rows", best.rows);
    board.style.setProperty("--fs", Math.floor(best.fs) + "px");
  }

  function sampleEvents() {
    var d = new Date();
    function at(h, m) { var x = new Date(d); x.setHours(h, m, 0, 0); return x.toISOString(); }
    return [
      { name: "Living Waters", start: at(17, 30), end: at(23, 59), rooms: ["Hospitality Room"] },
      { name: "Bread & Wine | Songsharing Night", start: at(18, 30), end: at(23, 59), rooms: ["Forest"] }
    ];
  }

  function currentItems() {
    if (mode === "key") {
      var keys = [];
      for (var i = 1; i <= 10; i++) keys.push({ keyItem: true, arrow: i, label: ARROWS[i].label });
      return keys;
    }
    var list = mode === "sample" ? sampleEvents() : (data && data.events) || [];
    var now = Date.now();
    return list
      .filter(function (e) { return e && e.name && Date.parse(e.end) > now; })
      .sort(function (a, b) { return (Date.parse(a.start) - Date.parse(b.start)) || a.name.localeCompare(b.name); });
  }

  function showPage() {
    var page = pages[pageIndex] || [];
    board.innerHTML = page.map(itemHtml).join("");
    if (page.length) fitBoard(page.length);
  }

  function render() {
    var items = currentItems();
    var per = mode === "key" ? 10 : PER_PAGE;
    welcome.hidden = items.length > 0;
    board.hidden = items.length === 0;
    pages = [];
    for (var i = 0; i < items.length; i += per) pages.push(items.slice(i, i + per));
    if (pageIndex >= pages.length) pageIndex = 0;
    showPage();
    updateStatus();
  }

  // A quiet line in the corner only when something needs attention.
  function updateStatus() {
    var msg = "";
    if (mode === "key" || mode === "sample") msg = mode === "key" ? "Arrow Key" : "Sample events";
    else if (!CFG.dataUrl) msg = "Add the Apps Script address to config.js";
    else if (!lastGood) msg = "Connecting to Planning Center";
    else if (Date.now() - lastGood > STALE_MINUTES * 60000) msg = "Can't reach Planning Center. Showing the update from " + formatTime(new Date(lastGood)) + ".";
    statusEl.hidden = !msg;
    statusEl.textContent = msg;
  }

  function save(d) { try { localStorage.setItem(STORE_KEY, JSON.stringify({ at: Date.now(), data: d })); } catch (err) {} }
  function restore() {
    try {
      var s = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
      if (s && s.data) { data = s.data; lastGood = s.at; }
    } catch (err) {}
  }

  function load() {
    if (!CFG.dataUrl || mode === "key" || mode === "sample") { render(); return; }
    var xhr = new XMLHttpRequest();
    var url = CFG.dataUrl + (CFG.dataUrl.indexOf("?") === -1 ? "?" : "&") + "t=" + Date.now();
    xhr.open("GET", url, true);
    xhr.timeout = 30000;
    xhr.onload = function () {
      try {
        var d = JSON.parse(xhr.responseText);
        if (d && d.events) { data = d; lastGood = Date.now(); save(d); }
      } catch (err) {}
      render();
    };
    xhr.onerror = xhr.ontimeout = function () { render(); };
    xhr.send();
  }

  // Pressing OK on the TV remote asks the browser for full screen.
  function goFullscreen() {
    var el = document.documentElement;
    var req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (req && !(document.fullscreenElement || document.webkitFullscreenElement)) {
      try { var p = req.call(el); if (p && p.catch) p.catch(function () {}); } catch (err) {}
    }
  }
  document.addEventListener("click", goFullscreen);
  document.addEventListener("keydown", function (ev) { if (ev.keyCode === 13) goFullscreen(); });

  window.addEventListener("hashchange", function () { mode = readMode(); pageIndex = 0; load(); });
  var resizeTimer;
  window.addEventListener("resize", function () { clearTimeout(resizeTimer); resizeTimer = setTimeout(showPage, 150); });

  setInterval(function () {
    if (pages.length < 2) return;
    pageIndex = (pageIndex + 1) % pages.length;
    showPage();
  }, PAGE_SECONDS * 1000);
  setInterval(render, 30000);
  setInterval(load, Math.max(1, CFG.refreshMinutes || 2) * 60000);

  // Reload the whole page once a night so the TV picks up any changes to the sign itself.
  var loadedAt = Date.now();
  setInterval(function () {
    var h;
    try { h = Number(new Intl.DateTimeFormat("en-US", { timeZone: TIME_ZONE, hour: "numeric", hour12: false }).format(new Date())) % 24; }
    catch (err) { h = new Date().getHours(); }
    if (h === 3 && Date.now() - loadedAt > 2 * 3600000) location.reload();
  }, 20 * 60000);

  try { if (navigator.wakeLock && navigator.wakeLock.request) navigator.wakeLock.request("screen").catch(function () {}); } catch (err) {}

  restore();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(load); else load();
})();
</script>
</body>
</html>
